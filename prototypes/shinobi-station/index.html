const canvas = document.getElementById('game');

// ---- Input -------------------------------------------------------------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {

addEventListener('keyup', e => down.delete(e.code));
let clickAt = null, drag = null, dragDelta = { x: 0, y: 0 };

// ---- Audio -------------------------------------------------------------------------------

// ---- Sprites (drawn in Aseprite) ---------------------------------------------------------
const SP = {};
let loaded = 0, total = 0;
for (const [name, s] of Object.entries(window.SPRITES)) {
  const img = new Image(); total++;
  img.onload = () => { loaded++; };
  img.src = s.src;
  SP[name] = { img, w: s.w, h: s.h, frames: s.frames, ax: s.ax, ay: s.ay, len: s.len_units };
}
function spr(name, frame, x, y, flip = false, alpha = 1, g = wx) {
  const s = SP[name]; if (!s || !s.img.complete) return;
  const f = Math.max(0, Math.min(s.frames - 1, frame | 0));

// ---- The village map ---------------------------------------------------------------------
const LAY = window.LAYOUT;

const TW = 32, TH = 16; // half a tile: the 64x32 tile's corner-to-centre offsets

function iso(i, j) { return [(i - j) * TW, (i + j) * TH]; }
const TILE_INDEX = Object.fromEntries(LAY.tileNames.map((n, k) => [n, k]));
function tileFrame(i, j) {

  if (i < 0 || j < 0 || i >= N || j >= N) return TILE_INDEX.forest;
  const t = LAY.tileOf[MAP[j][i]];
  if (t === 'grass' && ((i * 7 + j * 13) % 5 === 0)) return TILE_INDEX.grass_flowers;
  return TILE_INDEX[t];

for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
  const t = MAP[j][i];
  if (!WALK.has(t)) continue;
  tiles.all.push([i, j]);
  if (t === '#') tiles.street.push([i, j]);
  if (t === '+') tiles.plaza.push([i, j]);
  if (t === 'P') tiles.platform.push([i, j]);
  if (t === 'T') tiles.training.push([i, j]);
}
function bfs(from, to) {
  const key = (i, j) => j * N + i;
  if (!walkable(to[0], to[1])) return null;
  const prev = new Map(); const q = [from]; prev.set(key(from[0], from[1]), null);
  while (q.length) {
    const [i, j] = q.shift();
    if (i === to[0] && j === to[1]) break;
    for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const ni = i + di, nj = j + dj, k = key(ni, nj);
      if (walkable(ni, nj) && !prev.has(k)) { prev.set(k, [i, j]); q.push([ni, nj]); }
    }
  }
  if (!prev.has(key(to[0], to[1]))) return null;
  const path = []; let cur = to;
  while (cur && !(cur[0] === from[0] && cur[1] === from[1])) { path.unshift(cur); cur = prev.get(key(cur[0], cur[1])); }

}
const pick = arr => arr[Math.floor(rng() * arr.length)];
const ROOF = { house_block: 30, shop: 30, house_hip: 40, tower: 40, tree_big: 72, tree_small: 40, station: 36 };
const roofAt = {};
for (const p of LAY.placements) {
  if (p.i < 0 || p.j < 0 || p.i > N || p.j > N) continue;
  if (p.s === 'station') { for (let k = 5; k <= 7; k++) roofAt[`${k},8`] = ROOF.station; continue; }
  if (ROOF[p.s]) roofAt[`${Math.floor(p.i)},${Math.floor(p.j)}`] = ROOF[p.s];
}
const lanterns = LAY.placements.filter(p => p.s === 'lantern').map(p => {
  let best = null, bd = 1e9;
  for (const [i, j] of tiles.all) { const d = (i + 0.5 - p.i) ** 2 + (j + 0.5 - p.j) ** 2; if (d < bd) { bd = d; best = [i, j]; } }
  return { i: p.i, j: p.j, spot: best, lit: false };

const shopDoors = LAY.doors.filter(d => d.kind === 'shop');
const homeDoors = LAY.doors.filter(d => d.kind === 'home');

// ---- People ------------------------------------------------------------------------------
const NAMES = ['Haru', 'Ren', 'Kaito', 'Mio', 'Sora', 'Aki', 'Yuki', 'Daichi', 'Hina', 'Taro', 'Emi', 'Kenji', 'Nao', 'Rin', 'Shin', 'Asa', 'Kou', 'Mei', 'Jun', 'Saki', 'Toma', 'Ume', 'Riku', 'Nami', 'Goro', 'Fumi', 'Iku', 'Hoshi', 'Tetsu', 'Kiyo'];
const KID_NAMES = ['little Pip', 'little Tobi', 'little Momo', 'little Kei', 'little Sumi', 'little Bo'];
function makeAgent(kind, sprite, name, door, idx) {
  return {
    kind, sprite, name, door, idx, i: door.door[0] + 0.5, j: door.door[1] + 0.5,
    path: [], onArrive: null, speed: tune.walk_speed, visible: false, state: 'home', activity: 'at home',
    timer: 0, flip: false, back: false, dist: 0, pose: -1, lock: null, off: [(rng() - 0.5) * 0.34, (rng() - 0.5) * 0.34],

function curTile(a) {

}

  if (p === null) { a.path = []; if (onArrive) onArrive(); return false; }
  a.path = p.map(([i, j]) => [i + 0.5 + a.off[0], j + 0.5 + a.off[1]]);
  if (extra) a.path.push(extra);
  a.onArrive = onArrive || null; a.speed = speed || tune.walk_speed; a.state = 'walk';
  if (!a.path.length && onArrive) { a.onArrive = null; onArrive(); }

}
function leaveHome(a) {
  a.visible = true; a.i = a.door.door[0] + 0.5; a.j = a.door.door[1] + 0.08; a.state = 'idle'; a.timer = 0;
  a.path = [[a.door.door[0] + 0.5 + a.off[0], a.door.door[1] + 0.5 + a.off[1]]]; a.state = 'walk'; a.speed = tune.walk_speed;
  a.onArrive = () => nextActivity(a);

}
function goHome(a) {
  a.activity = 'heading home';
  goTo(a, a.door.door[0], a.door.door[1], () => { a.visible = false; a.state = 'home'; a.activity = 'at home'; }, a.kind === 'kid' ? tune.kid_speed : tune.walk_speed,
    [a.door.door[0] + 0.5, a.door.door[1] + 0.06]);
}
function linger(a, label, lo = tune.idle_min, hi = tune.idle_max, pose = -1) {

}
function isAwakeTime(a, t) {

  return t >= tune.wake_time && t < tune.home_time;

  if (!isAwakeTime(a, t)) { goHome(a); return; }

  if (a.watch) {
    const [i, j] = pick(tiles.street); a.activity = 'on night watch';
    goTo(a, i, j, () => linger(a, 'on night watch', 1, 4)); return;
  }
  const r = rng();
  const w = a.sprite === 'ninja' ? [0.32, 0.12, 0.16, 0.12, 0.28] : a.sprite === 'kunoichi' ? [0.18, 0.32, 0.18, 0.12, 0.2] : [0.0, 0.3, 0.1, 0.25, 0.35];
  // [train, shop, platform, plaza, wander]
  let acc = 0, choice = 4;
  for (let k = 0; k < w.length; k++) { acc += w[k]; if (r < acc) { choice = k; break; } }
  const run = a.sprite === 'ninja' && rng() < tune.errand_chance;
  const sp = run ? tune.run_speed : tune.walk_speed;

    const [i, j] = pick(tiles.training); a.activity = run ? 'running to training' : 'off to train';
    goTo(a, i, j, () => { linger(a, 'training', 8, 16, 8); }, sp);
  } else if (choice === 1 && shopDoors.length) {
    const d = pick(shopDoors); a.activity = 'going shopping';
    goTo(a, d.door[0], d.door[1], () => linger(a, 'shopping', 3, 8), sp);
  } else if (choice === 2) {
    const [i, j] = pick(tiles.platform.filter(([i]) => i >= 2)); a.activity = 'going to the station';
    goTo(a, i, j, () => { a.state = 'wait'; a.activity = 'waiting for the train'; a.timer = 40 + rng() * 30; }, sp);
  } else if (choice === 3) {
    const [i, j] = pick(tiles.plaza); a.activity = 'strolling to the square';
    goTo(a, i, j, () => linger(a, a.sprite === 'elder' ? 'resting in the square' : 'chatting in the square', 5, 14), sp);
  } else {
    const [i, j] = pick(tiles.street); a.activity = run ? 'running an errand' : 'taking a walk';

// ---- The train ---------------------------------------------------------------------------
const LOCO_LEN = 40 / 16, CAR_LEN = 36 / 16, GAP = 0.12;
function trainPieces(tr) {

}

// ---- State -------------------------------------------------------------------------------
let scene, state;

    panel(4, 4, 128, 15);
    text(`Day ${state.day}  ${clockText(t)}  ${partOfDay(t)}`, 9, 11.5, 7, '#f3ead6', 'left');
    text(`x${state.speed}`, 127, 11.5, 7, state.speed > 1 ? '#ffd27a' : '#9aa3b5', 'right');
    const tr = state.train;
    const trainTxt = tr.state === 'stopped' ? 'Train at the station' : tr.state === 'wait' ? `Next train in ${Math.ceil(tr.timer / Math.max(1, 1))}s` : (tr.state === 'arrive' ? 'Train arriving' : 'Train departing');
    panel(4, 21, 128, 12, 0.5);
    text(trainTxt, 9, 27, 6, '#cfd6e6', 'left', '500');
    state.log.forEach((l, k) => {
      const a = Math.min(1, (tune.log_seconds - l.age) / 1.5);
      ctx.globalAlpha = Math.max(0, a);
      panel(4, H - 16 - k * 13, Math.min(300, 8 + l.text.length * 3.5), 12, 0.6);
      text(l.text, 8, H - 10 - k * 13, 6, '#f3ead6', 'left', '500');
      ctx.globalAlpha = 1;
    });
    panel(W - 176, H - 16, 172, 12, 0.45);
    text('Space pause · 1 2 3 speed · drag or arrows to look · click a villager · H hide', W - 90, H - 10, 5, '#cfd6e6', 'center', '500');
  }
  const a = state.selected;
  if (a && a.visible && a.sx !== undefined) {
    const label = `${a.name}: ${a.activity}`;
    const ax = a.sx - (state.cam.x - W / 2), ay = a.sy - (state.cam.y - H / 2);
    const w = 10 + label.length * 3.4, x = Math.max(4, Math.min(W - w - 4, ax - w / 2)), y = Math.max(36, ay - SP[a.sprite].h - 14);
    panel(x, y, w, 12, 0.78);
    text(label, x + w / 2, y + 6, 6, '#ffe39a', 'center', '600');
  }
}

// ---- Scenes ------------------------------------------------------------------------------
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      wx.fillStyle = '#2a3342'; wx.fillRect(0, 0, W, H);
      const units = [['ninja', 0, 'ninja'], ['ninja', 4, 'ninja (back)'], ['ninja', 8, 'ninja punch'], ['kunoichi', 0, 'kunoichi'], ['kunoichi', 4, 'kunoichi (back)'],
        ['elder', 0, 'elder'], ['elder', 4, 'elder (back)'], ['kid', 0, 'kid'], ['cat', 0, 'cat'], ['bird', 0, 'sparrow'], ['hawk', 0, 'hawk']];
      wx.save(); wx.scale(2, 2);
      const pos = k => [18 + (k % 6) * 38, k < 6 ? 34 : 74];
      units.forEach(([n, f, label], k) => { const [x, y] = pos(k); spr(n, f, x, y); });
      wx.restore();
      spr('loco', 0, 120, 196); spr('car', 0, 300, 196);
      ctx.drawImage(wc, 0, 0, W, H);
      units.forEach(([n, f, label], k) => { const [x, y] = pos(k); text(label, x * 2, y * 2 + 8, 5.5, '#f3ead6', 'center', '500'); });
      text('locomotive', 150, 228, 6, '#f3ead6'); text('carriage', 330, 228, 6, '#f3ead6');
      text('Every figure here was drawn in Aseprite', W / 2, 258, 7, '#ffd27a');
      return true;
    },
  },
  title: {
    update(dt) {
      if (pressed('Enter') || pressed('Space') || clickAt) { clickAt = null; scene = 'play'; log('You arrive at the village'); }
      simulate(dt * 0.5);
      updateCamera(dt);
    },
    draw() {
      drawWorld(); ctx.drawImage(wc, 0, 0, W, H);
      ctx.fillStyle = 'rgba(12,14,24,0.55)'; ctx.fillRect(0, 70, W, 120);
      text(TITLE, W / 2, 98, 26, '#ffe39a', 'center', '700');
      text('a ninja village you sit and watch', W / 2, 120, 9, '#f3ead6', 'center', '500');
      CONTROLS.forEach((c, i) => text(c, W / 2, 140 + i * 11, 7, '#cfd6e6', 'center', '500'));
      text('Enter, Space or click to watch', W / 2, 186, 8, '#ffffff', 'center', '700');
      return true;
    },
  },
  play: {
    update(dt) {
      if (pressed('Space') || pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      if (pressed('Digit1')) state.speed = 1;
      if (pressed('Digit2')) state.speed = tune.speed_2;
      if (pressed('Digit3')) state.speed = tune.speed_3;
      if (pressed('KeyH')) state.hud = !state.hud;
      if (pressed('KeyR')) { const hud = state.hud; reset(); state.hud = hud; log('A new day in the village'); }
      if (clickAt) {
        let best = null, bd = 1e9;
        for (const a of state.agents) {
          if (!a.visible || a.sx === undefined) continue;
          const wxp = clickAt.x + state.cam.x - W / 2, wyp = clickAt.y + state.cam.y - H / 2;
          const dx = wxp - a.sx, dy = wyp - (a.sy - 12);
          const d = Math.hypot(dx, dy * 0.8);
          if (d < 14 && d < bd) { bd = d; best = a; }
        }
        state.selected = best; state.selectTimer = best ? 8 : 0; clickAt = null;
      }
      const n = state.speed;
      for (let k = 0; k < n; k++) simulate(dt);
      updateCamera(dt);
    },
    draw() { drawWorld(); ctx.drawImage(wc, 0, 0, W, H); drawHud(); },
  },
  pause: {
    update() {
      if (pressed('Space') || pressed('KeyP') || pressed('Escape')) scene = 'play';
      if (clickAt) clickAt = null;
    },
    draw() {
      scenes.play.draw();
      panel(W / 2 - 60, H / 2 - 16, 120, 32, 0.75);
      text('Paused', W / 2, H / 2 - 4, 12, '#ffe39a', 'center', '700');
      text('Space to carry on', W / 2, H / 2 + 9, 6, '#cfd6e6', 'center', '500');
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() {
  ctx.fillStyle = '#10131c'; ctx.fillRect(0, 0, W, H);
  if (loaded < total) { text('Loading the village...', W / 2, H / 2, 9, '#cfd6e6'); return; }
  scenes[scene].draw();
}
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
